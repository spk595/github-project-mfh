# .github/workflows/python-script.yml

name: Python Script Execution

on:
  push:
    branches:
      - main  # You can specify which branch to trigger on; 'main' is common.

jobs:
  run-python:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'

      - name: Run Script
        run: python hello.py

